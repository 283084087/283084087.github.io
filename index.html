<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时天气</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        body{
            min-height:100vh;
            background:linear-gradient(135deg,#4facfe,#00f2fe);
            color:#fff;
            padding:20px;
        }
        .container{
            max-width:450px;
            margin:0 auto;
            background:rgba(255,255,255,0.15);
            backdrop-filter:blur(10px);
            border-radius:24px;
            padding:30px;
            box-shadow:0 8px 32px rgba(0,0,0,0.1);
        }
        .location{font-size:22px;margin-bottom:10px;}
        .time{font-size:16px;opacity:0.9;margin-bottom:20px;}
        .temp{font-size:72px;font-weight:bold;line-height:1;}
        .weather-text{font-size:24px;margin:12px 0 30px;}
        .info-row{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:16px;
        }
        .info-card{
            background:rgba(255,255,255,0.12);
            padding:16px;
            border-radius:16px;
            text-align:center;
        }
        .info-card .label{font-size:14px;opacity:0.8}
        .info-card .val{font-size:20px;margin-top:6px;font-weight:bold}
        .loading{text-align:center;padding:40px;font-size:18px;}
    </style>
</head>
<body>
<div class="container">
    <div id="wrap" class="loading">正在获取定位和天气...</div>
</div>

<script>
const wrap = document.getElementById('wrap');
// 更新本地时间
function updateTime(){
    const now = new Date();
    const weekArr = ["周日","周一","周二","周三","周四","周五","周六"];
    return `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${weekArr[now.getDay()]} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
}

// 获取定位，然后获取天气
if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        getWeather(lat,lon);
    },err=>{
        getWeather(30.59,114.31); //定位失败默认武汉
    })
}else{
    getWeather(30.59,114.31);
}

async function getWeather(lat,lon){
    try{
        // 免费天气API
        const res = await fetch(`https://api.caiyunapp.com/v2.6/TAkhjf8d1nlSlspN/${lon},${lat}/realtime.json`);
        const json = await res.json();
        const weather = json.result.realtime;
        const place = json.location.name;
        const temp = weather.temperature;
        const sky = weather.skycon_desc;
        const hum = (weather.humidity*100).toFixed(0);
        const wind = `${weather.wind.speed.toFixed(1)} m/s`;

        wrap.innerHTML=`
            <div class="location">📍 ${place}</div>
            <div class="time" id="t">${updateTime()}</div>
            <div class="temp">${temp}°C</div>
            <div class="weather-text">${sky}</div>
            <div class="info-row">
                <div class="info-card">
                    <div class="label">湿度</div>
                    <div class="val">${hum}%</div>
                </div>
                <div class="info-card">
                    <div class="label">风速</div>
                    <div class="val">${wind}</div>
                </div>
            </div>
        `;
        setInterval(()=>{document.getElementById('t').innerText=updateTime()},1000);
    }catch(e){
        wrap.innerText="天气加载失败，请稍后刷新页面";
        console.error(e);
    }
}
</script>
</body>
</html>
